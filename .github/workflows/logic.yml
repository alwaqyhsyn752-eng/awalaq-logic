name: Logic Node
on: { repository_dispatch: { types: [analyze] } }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: ${{ secrets.CROSS_REPO_PAT }} }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Cache Model
        uses: actions/cache@v4
        with: { path: models, key: qwen-0.5b }
      - name: Setup AI
        run: |
          pip install llama-cpp-python
          mkdir -p models
          [ -f models/qwen.gguf ] || wget -q https://huggingface.co/Qwen/Qwen2.5-Coder-0.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf -O models/qwen.gguf
      - env: { PAYLOAD: "${{ toJson(github.event.client_payload) }}" }
        run: echo "$PAYLOAD" > job.json
      - run: python analyze.py
      - run: |
          git config user.name "logic-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out/
          git commit -m "logic: ${{ github.event.client_payload.job_id }}" || echo "no changes"
          git pull origin main --rebase || true
          git push
